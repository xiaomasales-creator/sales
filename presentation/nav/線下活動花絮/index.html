<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小馬娛樂 | 線下活動花絮 Gallery</title>
    <link rel="icon" type="image/png" href="https://xiaomasales-creator.github.io/sales/presentation/homepage/LOGO_ICON.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #8600ff;
            --secondary-neon: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --bg-dark: #050508;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-bottom: 120px;
            position: relative;
        }

        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'Share Tech Mono', monospace; }

        /* 背景網格 - 最底層 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(134, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(134, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: -2;
        }

        .grid-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(5, 5, 8, 0.8) 100%);
        }

        /* 點陣紋理背景 */
        .dots-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(134, 0, 255, 0.2) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
            opacity: 1;
        }

        /* 裝飾性幾何背景 */
        .floating-deco {
            position: fixed;
            color: var(--primary-neon);
            opacity: 0.05;
            font-family: 'Orbitron', sans-serif;
            font-size: 14vw;
            font-weight: 900;
            pointer-events: none;
            z-index: -1;
            user-select: none;
        }

        .floating-deco.outlined {
            color: transparent;
            -webkit-text-stroke: 1px var(--secondary-neon);
            opacity: 0.1;
        }

        /* 滿版容器與邊界裝飾 */
        .s-path-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 40px 80px 40px;
            position: relative;
        }

        /* 頁首樣式強化 */
        header.site-header {
            background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-dark) 70%, transparent 100%);
            position: relative;
            z-index: 50; 
            border-bottom: 0px solid rgba(134, 0, 255, 0.1);
        }

        /* 相片畫廊卡片樣式 */
        .gallery-card {
            position: relative;
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(134, 0, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .gallery-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            z-index: 2;
            pointer-events: none;
        }

        .gallery-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--secondary-neon);
            box-shadow: 0 10px 30px -5px rgba(0, 243, 255, 0.3), 0 0 15px rgba(134, 0, 255, 0.4);
        }

        .gallery-card:hover .card-img {
            transform: scale(1.08);
            filter: brightness(1.1) contrast(1.05);
        }

        .gallery-card:hover .card-overlay {
            opacity: 1;
        }

        .card-img-container {
            position: relative;
            width: 100%;
            padding-top: 62.5%; /* 16:10 比例 */
            overflow: hidden;
            background: #0d0d15;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1), filter 0.3s ease;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5, 5, 8, 0.95) 0%, rgba(5, 5, 8, 0.2) 60%, transparent 100%);
            opacity: 0.6;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .tech-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            padding: 3px 8px;
            background: rgba(134, 0, 255, 0.3);
            border: 1px solid var(--neon-purple);
            color: var(--secondary-neon);
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 賽博龐克 Lightbox 彈窗樣式 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 10, 0.92);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            position: relative;
            max-width: 1100px;
            width: 100%;
            background: rgba(12, 12, 20, 0.95);
            border: 1px solid var(--secondary-neon);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25), inset 0 0 20px rgba(134, 0, 255, 0.3);
            padding: 25px;
            border-radius: 4px;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-backdrop.active .modal-container {
            transform: scale(1);
        }

        .modal-img-wrapper {
            position: relative;
            width: 100%;
            max-height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .modal-img-wrapper img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
        }

        /* HUD 牆邊裝飾條 */
        .hud-corner {
            position: absolute;
            width: 15px;
            height: 15px;
            border-color: var(--secondary-neon);
            z-index: 10;
            pointer-events: none;
        }
        .hud-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .hud-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .hud-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .hud-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

        /* 箭頭按鈕與控制按鈕 */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 30;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .nav-arrow:hover {
            background: var(--secondary-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 25px var(--secondary-neon);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-prev { left: -25px; }
        .nav-next { right: -25px; }

        @media (max-width: 768px) {
            .nav-prev { left: 5px; }
            .nav-next { right: 5px; }
        }

        .close-modal-btn {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            font-size: 20px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 40;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }

        .close-modal-btn:hover {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 25px var(--neon-red);
            transform: rotate(90deg);
        }

        /* 控制面板設計 */
        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            max-width: 1100px;
            z-index: 1000;
        }

        .panel-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.9) 0%, rgba(5, 5, 5, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(134, 0, 255, 0.4);
            border-bottom: 2px solid rgba(134, 0, 255, 0.2);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }

        @media (min-width: 768px) {
            .panel-container { gap: 30px; padding: 15px 50px; border-radius: 4px; }
            .panel-container::before, .panel-container::after {
                content: "";
                position: absolute;
                top: 0;
                width: 25px;
                height: 100%;
                background: inherit;
                z-index: -1;
            }
            .panel-container::before { left: -12px; transform: skewX(-15deg); border-left: 1px solid rgba(134, 0, 255, 0.4); }
            .panel-container::after { right: -12px; transform: skewX(15deg); border-right: 1px solid rgba(134, 0, 255, 0.4); }
            .panel-btn { font-size: 1.15rem; } 
        }

        @media (max-width: 767px) {
            .panel-container { gap: 6px; padding: 12px 10px; border-radius: 12px; }
            .panel-btn { font-size: 0.85rem !important; letter-spacing: 0.05em !important; } 
        }

        .nav-item { position: relative; }

        .panel-btn {
            position: relative;
            font-weight: bold;
            color: #ccc;
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding-bottom: 8px;
            z-index: 2;
        }

        .energy-bar {
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--secondary-neon);
            box-shadow: 0 0 10px var(--secondary-neon);
            transition: width 0.3s ease;
        }

        .nav-item:hover .panel-btn {
            color: var(--secondary-neon);
            text-shadow: 0 0 8px var(--secondary-neon);
        }

        .nav-item:hover .energy-bar {
            width: 100%;
        }

        /* 子選單樣式 */
        .submenu {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(5, 5, 5, 0.98);
            border: 1px solid var(--primary-neon);
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
            backdrop-filter: blur(15px);
            padding: 12px;
            box-shadow: 0 0 30px rgba(134, 0, 255, 0.4);
            pointer-events: none;
            z-index: 1001;
            margin-bottom: 15px;
        }

        .submenu::before {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            height: 25px;
            background: transparent;
        }

        .nav-item:hover .submenu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .submenu-link {
            display: block;
            padding: 10px 14px;
            color: #bbb;
            font-size: 0.95rem; 
            text-align: left;
            transition: all 0.2s;
            border-left: 2px solid transparent;
            text-decoration: none;
        }

        .submenu-link:hover {
            background: rgba(134, 0, 255, 0.15);
            color: var(--secondary-neon);
            border-left: 2px solid var(--secondary-neon);
            padding-left: 18px;
        }

        /* Toast 提示 */
        .cyber-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid var(--secondary-neon);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 12px 24px;
            border-radius: 4px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cyber-toast.show {
            top: 30px;
        }

        .cyber-toast-dot {
            width: 8px;
            height: 8px;
            background: var(--secondary-neon);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--secondary-neon);
        }
    </style>
</head>

        // 渲染照片牆卡片
        function renderGallery() {
            const container = document.getElementById('gallery-grid');
            container.innerHTML = '';

            galleryData.forEach((item, index) => {
                const langContent = item[currentLang];
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => openModal(index);

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${item.img}" alt="${langContent.title}" class="card-img" onerror="this.src='https://placehold.co/800x500/0d0d15/00f3ff?text=XIAOMA+EVENT'">
                        <div class="card-overlay">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="tech-tag">${item.tag}</span>
                                    <span class="mono text-xs text-cyan-300/80">${item.date}</span>
                                </div>
                                <h3 class="font-bold text-lg text-white leading-snug line-clamp-1">${langContent.title}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-gradient-to-b from-[#0c0c16] to-[#050508]">
                        <div class="flex justify-between items-center mb-1">
                            <span class="cyber-font text-xs text-purple-400">NODE // 0${item.id}</span>
                            <span class="mono text-xs text-gray-400">VIEW FULL PHOTO ›</span>
                        </div>
                        <p class="text-sm text-gray-300 font-medium line-clamp-2">${langContent.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 開啟圖片彈窗
        function openModal(index) {
            currentPhotoIndex = index;
            updateModalContent();
            document.getElementById('photo-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 關閉圖片彈窗
        function closeModal() {
            document.getElementById('photo-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOnBackdrop(e) {
            if (e.target.id === 'photo-modal') {
                closeModal();
            }
        }

        // 切換前後照片
        function changePhoto(step) {
            currentPhotoIndex = (currentPhotoIndex + step + galleryData.length) % galleryData.length;
            updateModalContent();
        }

        // 更新 Modal 內容
        function updateModalContent() {
            const data = galleryData[currentPhotoIndex];
            const langContent = data[currentLang];

            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-title').innerText = langContent.title;
            document.getElementById('modal-desc').innerText = langContent.desc;
            document.getElementById('modal-tag').innerText = data.tag;
            document.getElementById('modal-date').innerText = data.date;
            document.getElementById('modal-index').innerText = String(currentPhotoIndex + 1).padStart(2, '0');
            document.getElementById('modal-total').innerText = String(galleryData.length).padStart(2, '0');
        }

        // 初始化
        window.onload = function() {
            renderGallery();
        };
        
        let toastTimer = null;

        // 觸發建置中彈窗 Toast
        function showNotice(msg) {
            const toast = document.getElementById('cyber-toast');
            if (!toast) return;
            toast.querySelector('span').innerText = msg || '該頁面尚在建置中，敬請期待！';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 判斷連結是否為無效或空連結
        function isEmptyLink(href) {
            if (!href) return true;
            const cleaned = href.trim();
            return (
                cleaned === '' ||
                cleaned === '#' ||
                cleaned.startsWith('javascript:void(0)') ||
                cleaned.startsWith('javascript:;')
            );
        }

        // 全局點擊監聽：當點擊無效連結時自動跳出提示 Toast
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link) {
                const href = link.getAttribute('href');
                if (isEmptyLink(href)) {
                    e.preventDefault();
                    showNotice('該頁面尚在建置中，敬請期待！');
                }
            }
        });
    </script>
