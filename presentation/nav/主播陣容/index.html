    <style>
        :root {
            --primary-neon: #8600ff;
            --secondary-neon: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --bg-dark: #050508;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding-bottom: 120px;
            position: relative;
        }

        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'Share Tech Mono', monospace; }

        /* 背景網格 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(134, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(134, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: -2;
        }
        .grid-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(5, 5, 8, 0.8) 100%);
        }

        /* 點陣紋理背景 */
        .dots-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(134, 0, 255, 0.2) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }

        .scanline {
            width: 100%;
            height: 4px;
            z-index: 999;
            background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.15) 50%, rgba(0, 243, 255, 0.05) 80%, transparent);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            position: fixed;
            pointer-events: none;
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Cyberpunk Alert Toast Notification */
        .cyber-toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 3500;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid var(--secondary-neon);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.15);
            padding: 14px 28px;
            border-radius: 4px;
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cyber-toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .cyber-toast-dot {
            width: 10px;
            height: 10px;
            background: var(--secondary-neon);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--secondary-neon);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .floating-deco {
            position: fixed;
            color: var(--primary-neon);
            opacity: 0.05;
            font-family: 'Orbitron', sans-serif;
            font-size: 14vw;
            font-weight: 900;
            pointer-events: none;
            z-index: -1;
            user-select: none;
        }
        .floating-deco.outlined {
            color: transparent;
            -webkit-text-stroke: 1px var(--secondary-neon);
            opacity: 0.1;
        }

        header.site-header {
            background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-dark) 70%, transparent 100%);

            z-index: 50; 
        }

        .cyber-frame {
            position: relative; width: 140px; height: 140px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; margin-bottom: 16px;
        }
        .glow-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--neon-purple), var(--secondary-neon), transparent);
            opacity: 0.2; filter: blur(8px); animation: rotate-glow 8s linear infinite; transition: 0.5s;
        }
        .thin-border {
            position: absolute; inset: 0; border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, rgba(188, 19, 254, 0.5), rgba(0, 243, 255, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; transition: 0.5s;
        }
        .inner-photo {
            width: 126px; height: 126px; border-radius: 50%; overflow: hidden;
            background: #000; position: relative; z-index: 1; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .inner-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(20%) brightness(0.8); transition: 0.5s; }

        .cyber-frame:hover .glow-ring { opacity: 0.8; filter: blur(12px); transform: scale(1.05); }
        .cyber-frame:hover .thin-border { transform: scale(1.05); background: linear-gradient(135deg, var(--neon-purple), var(--secondary-neon)); }
        .cyber-frame:hover .inner-photo img { filter: grayscale(0%) brightness(1.1); transform: scale(1.1); }

        @keyframes rotate-glow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .control-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 98%; max-width: 1100px; z-index: 1000;
        }
        .panel-container {
            position: relative; display: flex; justify-content: center; align-items: center; gap: 10px;

            const toast = document.getElementById('cyber-toast');

            toast.querySelector('span').innerText = msg || '該頁面尚在建置中，敬請期待！';
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

                cleaned === '#' ||
                cleaned.startsWith('javascript:void(0)') ||
                cleaned.startsWith('javascript:;')
            );

            { ch: "小鹽", en: "Yan", tags: ["MMORPG", "MOBA", "FPS", "Vtuber"], img: "https://xiaomasales-creator.github.io/sales/presentation/homepage/talents/9-0.png", url: "個人頁面/Yan/index.html" },
            { ch: "妖乖", en: "Monster", tags: ["MMORPG", "MOBA", "SLG"], img: "https://xiaomasales-creator.github.io/sales/presentation/homepage/talents/10-0.png", url: "個人頁面/Monster/index.html" },
            { ch: "丫布丁丁", en: "Pudding", tags: ["MMORPG", "MOBA", "RP", "社群紅人/Reels", "跳舞/Dancing", "主持站台/Hosting"], img: "https://xiaomasales-creator.github.io/sales/presentation/homepage/talents/11-0.png", url: "個人頁面/Pudding/index.html" }
        ];

        const listContainer = document.getElementById('talents-list');
        const filterBar = document.getElementById('filter-bar');
        
        function renderFilters() {
            filterBar.innerHTML = '';
            filterOptions.forEach(opt => {
                const btn = document.createElement('div');
                const isAll = opt === 'All';
                const isActive = isAll ? selectedFilters.length === 0 : selectedFilters.includes(opt);
                btn.className = `filter-tag ${isActive ? 'active' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => {
                    if (isAll) { selectedFilters = []; } 
                    else {
                        if (selectedFilters.includes(opt)) {
                            selectedFilters = selectedFilters.filter(f => f !== opt);
                        } else {
                            selectedFilters.push(opt);
                        }
                    }
                    renderFilters(); 
                    renderTalents();
                };
                filterBar.appendChild(btn);
            });
        }

        function renderTalents() {
            listContainer.innerHTML = '';
            talentsData.forEach((data, i) => {
                const isMatch = selectedFilters.length === 0 || selectedFilters.every(filter => data.tags.includes(filter));
                if (!isMatch) return;

                const displayName = currentLang === 'ch' ? data.ch : data.en;
                const imgSrc = (data.img && data.img !== "#") ? data.img : `https://picsum.photos/seed/talent${i}/300/300`;
                
                const item = document.createElement('div');
                item.className = 'flex flex-col items-center text-center'; 
                item.innerHTML = `
                    <div class="cyber-frame" onclick="navigateToTalent(${i})">
                        <div class="glow-ring"></div>
                        <div class="thin-border"></div>
                        <div class="inner-photo">
                            <img src="${imgSrc}" alt="${displayName}" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=${data.en}'">
                        </div>
                    </div>
                    <div>
                        <div class="cyber-font text-lg md:text-xl tracking-[0.15em] text-white/90 uppercase font-bold mb-1.5">${displayName}</div>
                        <div class="flex flex-wrap justify-center gap-1">
                            ${data.tags.map(t => `<span class="talent-tag">#${t}</span>`).join('')}
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function navigateToTalent(index) {
            const targetUrl = talentsData[index].url;
            if (targetUrl && targetUrl !== "#") {
                window.open(targetUrl, '_blank');
            }
        }

        function toggleLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-ch').classList.toggle('active', lang === 'ch');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            document.getElementById('main-title').innerText = lang === 'ch' ? '主播陣容' : '主播陣容';
            document.getElementById('sub-title').innerText = lang === 'ch' ? 'SUBSIDIARY_TALENT' : 'SUBSIDIARY_TALENT';
            renderTalents();
        }

        function scrollToSection(id) {
            const target = document.getElementById(id);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 初始化渲染
        renderFilters();
        renderTalents();
    </script>
</body>
</html>
